apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-app
  template:
    metadata:
      labels:
        app: hello-app
    spec:
      containers:
        - name: hello-container
          image: us-central1-docker.pkg.dev/terraform-cloudbuild-487613/hello-repo/hello-app:b4b51af
          ports:
            - containerPort: 8080
